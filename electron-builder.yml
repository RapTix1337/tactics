# Packaging configuration (E19.1): NSIS installer for Windows, installed
# per-user without elevation (GSI-08). The appId is final — changing it
# would break the auto-update path and the installer identity (ADR-047).
# The release workflow publishing installers is E19.3.
appId: io.github.raptix1337.tactics
productName: TactiCS
directories:
  output: dist
  buildResources: build
files:
  - out/**
# Bundled map data (03-technical-design.md §4.3): the composition root reads
# `<resources>/data/maps` in the packaged app (app-lifecycle.ts). The data
# README ships along; the registry ignores plain files by design.
extraResources:
  - from: data/maps
    to: data/maps
# Auto-update feed and release upload target (ADR-027/035, E19.3). This block
# is baked into the packaged app as `app-update.yml` — the electron-updater
# GitHub provider reads it there — and tells the release workflow where to
# upload installer + latest.yml. Drafts stay invisible to the updater until
# the maintainer publishes them manually (REL-01).
publish:
  provider: github
  owner: RapTix1337
  repo: tactics
  releaseType: draft
win:
  target: nsis
  # Placeholder art for 1.0 (ADR-047, resolves open question #9).
  icon: build/icon.ico
nsis:
  # One-click, current-user-only install — never triggers a UAC prompt
  # (GSI-08: per-user install, no admin).
  oneClick: true
  perMachine: false
  artifactName: ${productName}-Setup-${version}.${ext}
  # Uninstall hygiene (E19.2, ADR-048): remove the recorded GSI config so
  # CS2 stops POSTing to a dead endpoint after uninstall.
  include: build/installer.nsh
  # ADR-048 policy: user data (settings, profiles, strats) survives an
  # uninstall and a later reinstall. This is the default — stated here
  # because it is a decision, not an accident.
  deleteAppDataOnUninstall: false
