# Quality gate on the product's target platform: every PR and every push to
# main runs the full check chain on windows-latest. The release workflow is
# separate (E19.3).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs for the ADR-034 spike evidence (20 CI runs, E4.1).
  workflow_dispatch:

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm can skip Electron's postinstall binary download when the package
      # is served from the store cache (see README) — build and packaging
      # need the binary.
      - name: Ensure the Electron binary is present
        run: if (-not (Test-Path node_modules/electron/dist)) { node node_modules/electron/install.js }

      - name: Lint
        run: pnpm lint

      - name: Verify boundary rules still fire
        run: pnpm lint:boundaries

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck (node, web, neutral)
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The release-blocking E2E suite (E20.2, 10-testing.md §1.3): the thin
      # smoke scenarios against the built app via Playwright, in test mode
      # (E20.1). Runs in this job so it reuses the Build step's output.
      - name: E2E (Playwright, built app)
        run: pnpm test:e2e

      - name: Packaging smoke test
        run: pnpm package:dir
